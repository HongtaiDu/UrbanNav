# # Enable Bluetooth stack
# CONFIG_BT=y

# # Set the name that shows up on your phone
# CONFIG_BT_DEVICE_NAME="Test_Beacon_003"

# # Required for non-connectable GAP broadcaster
# CONFIG_BT_OBSERVER=n
# CONFIG_BT_PERIPHERAL=n
# CONFIG_BT_CENTRAL=n

# # Required UF2 drag-and-drop output
# CONFIG_BUILD_OUTPUT_UF2=y

# # Keep LOG off for minimal footprint
# CONFIG_LOG=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Test_Beacon_003"
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_LOG=n

# Needed for TX power control
CONFIG_BT_HCI_VS=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# Required for GATT characteristics (fixes undefined reference linker errors)
CONFIG_BT_GATT_CLIENT=n

# Restores the last user-configured TX power immediately on startup
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
# This ensures the nRF52840 can handle the 2M PHY
CONFIG_BT_USER_PHY_UPDATE=y